<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Схема Свердловской области">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0b1224"/>
    </linearGradient>
    <style>
      .region-border { fill: none; stroke: #38bdf8; stroke-width: 3; }
      .region-fill { fill: #0ea5e9; fill-opacity: 0.15; }
      .label { fill: #e2e8f0; font-size: 18px; font-family: "Inter", "Segoe UI", Arial, sans-serif; font-weight: 600; }
    </style>
  </defs>

  <rect x="0" y="0" width="640" height="420" rx="28" fill="url(#bg)"/>
  
  <!-- Граница Свердловской области (упрощенный контур) -->
  <path class="region-fill" d="M 80 40 L 280 40 L 420 60 L 570 60 L 590 170 L 590 290 L 460 390 L 270 390 L 60 290 L 60 170 Z"/>
  <path class="region-border" d="M 80 40 L 280 40 L 420 60 L 570 60 L 590 170 L 590 290 L 460 390 L 270 390 L 60 290 L 60 170 Z"/>

  <!-- Название региона -->
  <text x="320" y="220" class="label" text-anchor="middle">Свердловская область</text>
</svg>
