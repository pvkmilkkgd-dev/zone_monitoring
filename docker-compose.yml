version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: zone_monitoring_db
    environment:
      POSTGRES_DB: zone_monitoring
      POSTGRES_USER: zone_user
      POSTGRES_PASSWORD: Ural196User!
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init_db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zone_user -d zone_monitoring"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zone_network

  # Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zone_monitoring_backend
    environment:
      DATABASE_URL: postgresql+psycopg2://zone_user:Ural196User!@db:5432/zone_monitoring
      DEBUG: "True"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend/maps:/app/maps
    networks:
      - zone_network
    restart: unless-stopped

  # Frontend (Vite + React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zone_monitoring_frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - zone_network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  zone_network:
    driver: bridge
